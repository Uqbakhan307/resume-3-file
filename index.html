<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://www.transparenttextures.com/patterns/asfalt.png'); /* Example texture */
    background-color: #a8d3a8; /* Fallback color */
    font-family: Arial, sans-serif;
}

.container {
    background: rgba(255, 255, 255, 0.8);
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    width: 500px;
}

h2 {
    margin-bottom: 20px;
    text-align: center;
}

.input-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}
.option-group {
margin:bottom 15px;
}
label {
    display: block;
    margin-bottom: 5px;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #5eca5e;
    border: none;
    border-radius: 4px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #5ea15e;
}

</style>
<body>
    <div class="container">
        <form class="login-form">
            <center><h1>Sign In</h1></center>
            <div class="input-group">
                <label for="username"><b>Username</b></label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="email"><b>Emaill</b></label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="password"><b>Password</b></label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="input-group">
                <label for="date of birth"><b>Date of birth</b></label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="input-group">
                <fieldset>
            <legend><label for="gender"><b>Gender</b></label></legend>
                <input type="radio" id="radio" name="radio" required>male
                <input type="radio" id="radio" name="radio" required>female
                <input type="radio" id="radio" name="radio" required>other
                </fieldset>
            </div>
            <div class="option-group">
                <label for="country"><b>Select county</b></label>
                <select name="country" id="country" width="5">
                    <option value="sel">select</option>
                    <option value="pak">pakistan</option>
                    <option value="ind">India</option>
                    <option value="japan">japan</option>
                    <option value="chin">China</option>
                    <option value="amer">America</option>
                </select>
            </div>
            <br>
            <button type="submit">Sign In</button>
            <br>
            <p>Do you have account? <a href="login.html">Login</a></p>
        </form>
    </div>
</body>
</html>
